version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pdv_postgres
    environment:
      POSTGRES_USER: pdv_user
      POSTGRES_PASSWORD: pdv_password
      POSTGRES_DB: pdv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdv_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pdv_user:pdv_password@db:5432/pdv_db
      JWT_SECRET: your_jwt_secret_key_change_in_production
      JWT_EXPIRE: 24h
      REFRESH_TOKEN_EXPIRE: 7d
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdv_frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm start

volumes:
  postgres_data:

networks:
  default:
    name: pdv_network
