version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pdv_database
    environment:
      POSTGRES_USER: pdv_user
      POSTGRES_PASSWORD: pdv_password
      POSTGRES_DB: pdv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv_user -d pdv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdv_backend
    environment:
      DATABASE_URL: postgresql://pdv_user:pdv_password@postgres:5432/pdv_db
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdv_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: pdv_network
